name: Validate mod data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and tileset assets
        run: python tools/validate_mod_assets.py
      - name: Build release archives
        run: python tools/package_release.py
      - name: Check release archive and Eclipse flow
        run: python -m unittest discover -s tools -p 'test_*.py'
